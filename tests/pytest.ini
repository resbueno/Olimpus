[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    api: testes de API
    integration: testes de integração
    slow: testes lentos
    auth: testes de autenticação
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning