<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORÁCULO — Hub de Notícias</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230284c7'/><path d='M6 10h20M6 14h14M6 18h17M6 22h11' stroke='white' stroke-width='2' stroke-linecap='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff;--bg2:#ffffff;--bg3:#f8f9fa;--bg-alt:#f8f9fa;
  --glass:rgba(255,255,255,0.7);
  --border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.13);
  --accent:#0284c7;--accent2:#0369a1;--accent-bg:rgba(2,132,199,0.08);
  --success:#16a34a;--success-bg:rgba(22,163,74,0.07);
  --danger:#dc2626;--danger-bg:rgba(220,38,38,0.07);
  --warn:#d97706;--warn-bg:rgba(217,119,6,0.07);
  --text:#1f1f1f;--text-mid:#5f6368;--text-dim:#9ca3af;
  --sans:'Outfit',sans-serif;--display:'Space Grotesk',sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
  --r:12px;--r2:20px;--radius:20px;
  --sh:0 4px 20px rgba(0,0,0,0.06);
}

body.dark-mode{
  --bg:#0b0f1a;--bg2:#1f2937;--bg3:#111827;--bg-alt:#111827;
  --glass:rgba(17,24,39,0.7);
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.12);
  --text:#f3f4f6;--text-mid:#9ca3af;--text-dim:#6b7280;
  --sh:0 4px 20px rgba(0,0,0,0.3);
}
body.dark-mode .card,body.dark-mode .modal,body.dark-mode .topbar,
body.dark-mode .sidebar,body.dark-mode .stat-card,
body.dark-mode .login-card,body.dark-mode .login-box{background:#1f2937}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;transition:background-color .4s,color .4s}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.08);border-radius:20px}

/* LOGIN */
#ls{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999}
#ls.hidden{display:none}
.lp{width:400px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);box-shadow:0 12px 48px rgba(0,0,0,.1);overflow:hidden}
.lt{background:linear-gradient(135deg,#0284c70d,#16a34a08);border-bottom:1px solid var(--border);padding:32px 36px 28px;text-align:center}
.llo{display:inline-flex;align-items:center;gap:14px;margin-bottom:8px}
.lico{width:44px;height:44px;background:var(--accent-bg);border:1px solid var(--accent);border-radius:10px;display:grid;place-items:center}
.lico svg{width:22px;height:22px}
.lbrand{font-size:1.8rem;font-weight:700;letter-spacing:.06em}
.lsub{font-family:var(--mono);font-size:.68rem;color:var(--text-dim);letter-spacing:.14em;margin-top:4px;text-transform:uppercase}
.lf{padding:28px 36px 32px;display:flex;flex-direction:column;gap:16px}
.lerr{background:var(--danger-bg);border:1px solid var(--danger);border-radius:var(--r);padding:8px 12px;font-size:.8rem;color:var(--danger);display:none}
.lerr.show{display:block}
.lfg{display:flex;flex-direction:column;gap:5px}
.flab{font-size:.72rem;font-weight:500;color:var(--text-mid);letter-spacing:.05em}
.fi{background:var(--bg-alt);border:1px solid var(--border);color:var(--text);font-family:var(--mono);font-size:.85rem;padding:10px 14px;border-radius:var(--r);outline:none;transition:border-color .15s,box-shadow .15s;width:100%}
.fi:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.fi::placeholder{color:var(--text-dim)}
.btn-login{background:var(--accent);border:none;color:#fff;font-family:var(--sans);font-size:.88rem;font-weight:600;padding:11px;border-radius:var(--r);cursor:pointer;transition:background .15s;letter-spacing:.04em;margin-top:4px}
.btn-login:hover{background:var(--accent2)}
.lhint{font-size:.7rem;color:var(--text-dim);text-align:center;font-family:var(--mono)}

/* APP SHELL */
#app{display:flex;flex-direction:column;flex:1}
.topbar{height:56px;background:var(--bg);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:100;flex-shrink:0}
.tbl{display:flex;align-items:center;gap:16px}
.bicon{width:32px;height:32px;background:var(--accent-bg);border:1px solid var(--accent);border-radius:6px;display:grid;place-items:center}
.bicon svg{width:17px;height:17px}
.bname{font-size:1.05rem;font-weight:700;letter-spacing:.08em}
.bsep{width:1px;height:20px;background:var(--border)}
.bmod{font-family:var(--mono);font-size:.7rem;color:var(--text-dim);letter-spacing:.1em}
.tbr{display:flex;align-items:center;gap:12px}
.live{display:flex;align-items:center;gap:6px;background:var(--accent-bg);border:1px solid var(--accent);border-radius:20px;padding:3px 10px;font-family:var(--mono);font-size:.65rem;color:var(--accent);letter-spacing:.1em}
.ldot{width:6px;height:6px;background:var(--accent);border-radius:50%;animation:blink 2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.tclock{font-family:var(--mono);font-size:.78rem;color:var(--text-mid)}
.uchip{display:flex;align-items:center;gap:8px;padding:4px 10px;border:1px solid var(--border);border-radius:20px;cursor:pointer;transition:all .15s;position:relative}
.uchip:hover{border-color:var(--border2);background:var(--bg3)}
.uav{width:26px;height:26px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-size:.62rem;font-weight:700;color:#fff}
.uname{font-size:.78rem;font-weight:500}
.urole{font-family:var(--mono);font-size:.6rem;color:var(--text-dim)}
.umenu{position:absolute;top:calc(100% + 6px);right:0;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);box-shadow:0 4px 16px rgba(0,0,0,.1);min-width:160px;display:none;z-index:200}
.uchip.open .umenu{display:block}
.umi{padding:9px 14px;font-size:.82rem;cursor:pointer;display:flex;align-items:center;gap:8px;color:var(--text-mid);transition:background .1s}
.umi:hover{background:var(--bg3);color:var(--text)}
.umi.danger:hover{background:var(--danger-bg);color:var(--danger)}
.umsep{height:1px;background:var(--border);margin:4px 0}

/* BODY LAYOUT */
.body-wrap{display:flex;flex:1;overflow:hidden}
.sidebar{width:220px;min-width:220px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto}
.sb-section{padding:10px 12px 4px;font-size:.62rem;font-weight:600;color:var(--text-dim);letter-spacing:.12em;text-transform:uppercase}
.si{padding:8px 14px;cursor:pointer;transition:background .1s;display:flex;align-items:center;gap:10px;border-left:3px solid transparent}
.si:hover{background:var(--bg3)}
.si.sel{background:var(--accent-bg);border-left-color:var(--accent)}
.si svg{width:15px;height:15px;flex-shrink:0;stroke:var(--text-dim)}
.si.sel svg{stroke:var(--accent)}
.si-lbl{font-size:.82rem;font-weight:500;color:var(--text-mid)}
.si.sel .si-lbl{color:var(--accent);font-weight:600}
.sb-div{height:1px;background:var(--border);margin:6px 0}
.main{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:20px}

/* PAGE HEAD */
.phd{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pctx{font-family:var(--mono);font-size:.68rem;color:var(--text-dim);letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.ptit{font-size:1.4rem;font-weight:700}
.pact{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* BTN */
.btn{font-family:var(--sans);font-size:.78rem;font-weight:500;padding:7px 14px;border-radius:var(--r);border:1px solid;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:5px}
.bp{background:var(--accent);border-color:var(--accent);color:#fff}.bp:hover{background:var(--accent2);border-color:var(--accent2)}
.bo{background:transparent;border-color:var(--border2);color:var(--text-mid)}.bo:hover{border-color:var(--text-mid);color:var(--text);background:var(--bg3)}
.bd{background:transparent;border-color:var(--border);color:var(--text-mid)}.bd:hover{background:var(--danger-bg);border-color:var(--danger);color:var(--danger)}
.bs{background:transparent;border-color:var(--border);color:var(--text-mid)}.bs:hover{background:var(--success-bg);border-color:var(--success);color:var(--success)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* BADGE */
.badge{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:.62rem;font-weight:600;padding:2px 7px;border-radius:8px;letter-spacing:.05em;white-space:nowrap}
.b-alto{background:var(--danger-bg);color:var(--danger);border:1px solid #dc262633}
.b-medio{background:var(--warn-bg);color:var(--warn);border:1px solid #d9770633}
.b-baixo{background:var(--success-bg);color:var(--success);border:1px solid #16a34a33}
.b-enviado{background:var(--success-bg);color:var(--success);border:1px solid #16a34a33}
.b-pendente{background:var(--warn-bg);color:var(--warn);border:1px solid #d9770633}
.b-erro{background:var(--danger-bg);color:var(--danger);border:1px solid #dc262633}
.b-admin{background:#f5f3ff;color:#7c3aed;border:1px solid #7c3aed33}
.b-editor{background:var(--accent-bg);color:var(--accent);border:1px solid #0284c733}
.b-leitor{background:var(--bg3);color:var(--text-mid);border:1px solid var(--border)}

/* CARD */
.card{background:var(--bg);border:1px solid var(--border);border-radius:var(--r2);overflow:hidden}
.chd{padding:12px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px}
.cttl{font-size:.78rem;font-weight:600;letter-spacing:.04em}
.chint{font-family:var(--mono);font-size:.65rem;color:var(--text-dim)}
.cbdy{padding:18px}

/* METRICS */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.mc{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:16px;display:flex;flex-direction:column;gap:4px}
.mlb{font-size:.67rem;font-weight:500;color:var(--text-dim);letter-spacing:.08em;text-transform:uppercase}
.mv{font-family:var(--mono);font-size:1.6rem;font-weight:600}
.mv.sky{color:var(--accent)}.mv.green{color:var(--success)}.mv.red{color:var(--danger)}.mv.warn{color:var(--warn)}.mv.dim{color:var(--text-dim)}

/* TABLE */
.twrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.83rem}
th{font-size:.67rem;font-weight:600;color:var(--text-dim);letter-spacing:.08em;text-transform:uppercase;padding:8px 14px;border-bottom:2px solid var(--border);text-align:left;white-space:nowrap;background:var(--bg-alt)}
td{padding:9px 14px;border-bottom:1px solid var(--border);color:var(--text-mid);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.cr{cursor:pointer;transition:background .1s}
tr.cr:hover td{background:var(--bg3);color:var(--text)}
.tdt{color:var(--text);font-weight:500;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* FILTER BAR */
.fbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fsel{background:var(--bg3);border:1px solid var(--border);color:var(--text);font-family:var(--mono);font-size:.76rem;padding:6px 10px;border-radius:var(--r);outline:none;cursor:pointer}
.fsel:focus{border-color:var(--accent)}
.fsrch{background:var(--bg3);border:1px solid var(--border);color:var(--text);font-family:var(--mono);font-size:.76rem;padding:6px 12px;border-radius:var(--r);outline:none;width:200px}
.fsrch:focus{border-color:var(--accent)}
.fsrch::placeholder{color:var(--text-dim)}

/* RELEVANCE BAR */
.rel-bar{display:inline-flex;align-items:center;gap:6px}
.rel-track{width:60px;height:5px;background:var(--border);border-radius:3px;overflow:hidden}
.rel-fill{height:100%;border-radius:3px;background:var(--accent)}

/* INSIGHT CARD */
.ins-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.ins-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:all .18s}
.ins-card:hover{border-color:var(--accent);box-shadow:var(--sh);transform:translateY(-2px)}
.ins-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.ins-title{font-size:.9rem;font-weight:600;color:var(--text);line-height:1.4;flex:1}
.ins-desc{font-size:.82rem;color:var(--text-mid);line-height:1.5}
.ins-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ins-meta{font-family:var(--mono);font-size:.62rem;color:var(--text-dim)}

/* NEWSLETTER VIEW */
.nl-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);overflow:hidden;transition:all .18s}
.nl-card:hover{border-color:var(--accent);box-shadow:var(--sh)}
.nl-hd{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px}
.nl-title{font-size:.88rem;font-weight:600}
.nl-meta{font-family:var(--mono);font-size:.65rem;color:var(--text-dim)}
.nl-body{padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.nl-section{font-size:.68rem;font-weight:600;color:var(--text-dim);letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.nl-item{border-left:3px solid var(--border);padding:6px 10px;font-size:.82rem}
.nl-item.alto{border-color:var(--danger)}
.nl-item.medio{border-color:var(--warn)}
.nl-item.baixo{border-color:var(--success)}
.nl-act{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px}

/* KPI TABLE extras */
.kpi-val{font-family:var(--mono);font-size:1rem;font-weight:600;color:var(--accent)}
.kpi-unit{font-family:var(--mono);font-size:.7rem;color:var(--text-dim)}

/* COLOR SWATCH */
.cswatch{display:inline-block;width:14px;height:14px;border-radius:3px;flex-shrink:0;vertical-align:middle;margin-right:6px;border:1px solid rgba(0,0,0,.08)}

/* MODAL */
.moverlay{position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:600;display:none;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
.moverlay.show{display:flex}
.mbox{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);width:500px;max-width:96vw;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.mbox.wide{width:640px}
.mhd{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.mttl{font-size:.95rem;font-weight:700}
.mcls{width:28px;height:28px;border:1px solid var(--border);border-radius:var(--r);background:transparent;cursor:pointer;display:grid;place-items:center;color:var(--text-dim);transition:all .15s;flex-shrink:0}
.mcls:hover{border-color:var(--border2);color:var(--text);background:var(--bg3)}
.mbdy{padding:20px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.mft{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;flex-shrink:0}
.fg{display:flex;flex-direction:column;gap:5px}
.fl{font-size:.72rem;font-weight:500;color:var(--text-mid);letter-spacing:.05em}
.finp{background:var(--bg3);border:1px solid var(--border);color:var(--text);font-family:var(--mono);font-size:.85rem;padding:9px 12px;border-radius:var(--r);outline:none;transition:border-color .15s;width:100%}
.finp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.finp::placeholder{color:var(--text-dim)}
textarea.finp{resize:vertical;min-height:80px;font-family:var(--sans)}
select.finp{cursor:pointer}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cat-pills{display:flex;flex-wrap:wrap;gap:6px;padding:8px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r)}
.cpill{font-family:var(--mono);font-size:.68rem;padding:3px 10px;border-radius:20px;border:1px solid;cursor:pointer;transition:all .15s;user-select:none}
.cpill.sel{font-weight:600}

/* NL PREVIEW MODAL */
.nl-preview{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:16px;font-size:.85rem;line-height:1.7}
.nl-preview h3{font-size:.8rem;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:.08em;margin:12px 0 6px}
.nl-preview h3:first-child{margin-top:0}
.nl-preview .nlp-item{border-left:3px solid var(--accent);padding:4px 10px;margin-bottom:6px;color:var(--text-mid)}
.nl-preview .nlp-item strong{color:var(--text)}

/* TOAST */
#toast{position:fixed;bottom:24px;right:24px;background:var(--text);color:#fff;border-radius:var(--r);padding:10px 18px;font-size:.8rem;font-family:var(--mono);letter-spacing:.03em;box-shadow:0 4px 20px rgba(0,0,0,.22);opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:none;z-index:9999;max-width:340px}
#toast.show{opacity:1;transform:translateY(0)}
#toast.ok{background:var(--success)}
#toast.err{background:var(--danger)}

/* EMPTY STATE */
.empty{text-align:center;padding:48px 24px;color:var(--text-dim)}
.empty svg{width:40px;height:40px;margin:0 auto 12px;display:block;stroke:var(--border2)}
.empty p{font-size:.85rem}

/* ── OLIMPUS LAYOUT ─────────────────────────────────────── */
body{height:100vh;overflow:hidden;display:flex;flex-direction:column}
.dashboard-layout{padding:20px;height:100vh;overflow:hidden;display:flex;justify-content:center;align-items:stretch}
.main-area{width:100%;max-width:1500px;display:flex;flex-direction:column;background:var(--bg-alt);border-radius:var(--radius);overflow:hidden;position:relative;box-shadow:0 8px 40px rgba(0,0,0,.08)}
.main-area::after{content:'';position:absolute;inset:0;box-shadow:inset 0 0 120px 60px var(--bg);pointer-events:none;z-index:0}
.topbar{position:relative;z-index:10;background:transparent;border-bottom:1px solid var(--border)}
.bwrap,.content-area{position:relative;z-index:1}
.sidebar{background:transparent;border-right:1px solid var(--border)}

/* ── LOGIN ESTILO OLIMPUS ───────────────────────────────── */
#login-screen,#ls{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;align-items:center;justify-content:center;transition:opacity .4s,visibility .4s}
#login-screen.hidden,#ls.hidden{opacity:0;visibility:hidden;pointer-events:none}
.login-card,.login-box,.lp{width:420px;text-align:center;padding:0}
.login-card .login-top,.login-box .lt,.lp .lt{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 6%,transparent),transparent);border-bottom:1px solid var(--border);border-radius:var(--radius) var(--radius) 0 0;padding:36px 40px 28px}
.login-card,.login-box,.lp{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 20px 60px rgba(0,0,0,.08)}
.login-brand,.lbrand{font-family:var(--display);font-size:1.8rem;font-weight:700;letter-spacing:.06em;color:var(--text)}
.login-sub,.lsub{font-family:var(--mono);font-size:.65rem;color:var(--text-dim);letter-spacing:.14em;text-transform:uppercase;margin-top:6px}
.login-form,.lf{padding:28px 40px 36px;display:flex;flex-direction:column;gap:14px}
.login-err,.lerr{background:var(--danger-bg);border:1px solid var(--danger);border-radius:var(--r);padding:9px 12px;font-size:.8rem;color:var(--danger);display:none}
.login-err.show,.lerr.show{display:block}
.fi{background:var(--bg-alt);border:1px solid var(--border);border-radius:var(--r);color:var(--text);font-family:var(--sans);font-size:.92rem;padding:13px 16px;outline:none;width:100%;transition:border-color .15s,box-shadow .15s}
.fi:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.fi::placeholder{color:var(--text-dim)}
.btn-login{background:var(--accent);border:none;color:#fff;font-family:var(--display);font-size:.95rem;font-weight:600;padding:13px;border-radius:var(--r);cursor:pointer;transition:background .15s,transform .1s;width:100%;margin-top:4px}
.btn-login:hover{background:var(--accent2);transform:translateY(-1px)}

/* ── TOAST ──────────────────────────────────────────────── */
#toast{position:fixed;bottom:24px;right:24px;z-index:9999;background:var(--text);color:#fff;border-radius:var(--r);padding:10px 20px;font-size:.82rem;box-shadow:0 4px 20px rgba(0,0,0,.22);opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:none;max-width:340px}
#toast.show{opacity:1;transform:translateY(0)}
#toast.ok{background:var(--success)}
#toast.err{background:var(--danger)}

/* ── THEME TOGGLE ───────────────────────────────────────── */
.theme-toggle{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.theme-toggle:hover{border-color:var(--accent);transform:scale(1.05)}
body.dark-mode .theme-toggle{background:var(--bg2)}


/* main-area height fix */
.dashboard-layout{display:flex;align-items:stretch}
.main-area{display:flex;flex-direction:column;flex:1;height:100%}
.main-area #app{flex:1;display:flex;flex-direction:column;overflow:hidden}

</style>

<script>
'use strict';
// ── State ─────────────────────────────────────────────────────────────────────
let ME = null;
let VIEW = 'dashboard';
let DATA = { departments:[], users:[], categories:[], sources:[], kpis:[] };

// ── Clock ─────────────────────────────────────────────────────────────────────
function tick(){ document.getElementById('clock').textContent = new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'}); }
tick(); setInterval(tick,1000);

// ── Toast ─────────────────────────────────────────────────────────────────────
let _tt;
function toast(msg,kind=''){
  const el=document.getElementById('toast');
  el.textContent=msg; el.className='show '+kind;
  clearTimeout(_tt); _tt=setTimeout(()=>el.className='',4000);
}

// ── API ───────────────────────────────────────────────────────────────────────
async function api(method,path,body){
  const opt={method,credentials:'same-origin',headers:{}};
  if(body){opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(body);}
  const r=await fetch(path,opt);
  const j=await r.json();
  return {ok:r.ok,status:r.status,data:j.data,error:j.error,raw:j};
}

// ── Auth ──────────────────────────────────────────────────────────────────────
function initials(n){ return (n||'?').split(' ').slice(0,2).map(x=>x[0]).join('').toUpperCase(); }

function setUser(u){
  ME=u;
  document.getElementById('uav').textContent=initials(u.nome||u.email);
  document.getElementById('uname').textContent=u.nome||u.email;
  document.getElementById('urole').textContent=u.role;
}

async function doLogin(){
  const email=document.getElementById('lemail').value.trim();
  const senha=document.getElementById('lsenha').value;
  const err=document.getElementById('lerr');
  err.classList.remove('show');
  if(!email||!senha){err.textContent='Preencha e-mail e senha.';err.classList.add('show');return;}
  const r=await api('POST','/api/auth/login',{email,senha});
  if(r.ok){
    setUser(r.data);
    document.getElementById('ls').classList.add('hidden');
    document.getElementById('app').style.display='flex';
    await loadMeta();
    nav('dashboard');
  } else {
    err.textContent=r.error||'Credenciais inválidas.';
    err.classList.add('show');
  }
}
document.getElementById('lsenha').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});

async function doLogout(){
  await api('POST','/api/auth/logout');
  ME=null;
  document.getElementById('app').style.display='none';
  document.getElementById('ls').classList.remove('hidden');
  document.getElementById('lerr').classList.remove('show');
  document.getElementById('lemail').value='';
  document.getElementById('lsenha').value='';
  document.getElementById('uchip').classList.remove('open');
}

// ── Meta loader ───────────────────────────────────────────────────────────────
async function loadMeta(){
  const [depts,cats,sources,kpis] = await Promise.all([
    api('GET','/api/departments'),
    api('GET','/api/categories'),
    api('GET','/api/sources'),
    api('GET','/api/kpis'),
  ]);
  DATA.departments = depts.data||[];
  DATA.categories  = cats.data||[];
  DATA.sources     = sources.data||[];
  DATA.kpis        = kpis.data||[];
}

// ── Navigation ────────────────────────────────────────────────────────────────
function nav(v){
  VIEW=v;
  document.querySelectorAll('.si').forEach(el=>el.classList.toggle('sel',el.dataset.view===v));
  const views={
    dashboard: renderDashboard,
    noticias:  renderNoticias,
    kpis:      renderKPIs,
    insights:  renderInsights,
    newsletter:renderNewsletter,
    fontes:    renderFontes,
    categorias:renderCategorias,
    departamentos:renderDepartamentos,
    usuarios:  renderUsuarios,
    config:    renderConfig,
  };
  (views[v]||renderDashboard)();
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function canEdit(){ return ME&&(ME.role==='admin'||ME.role==='editor'); }
function canAdmin(){ return ME&&ME.role==='admin'; }
function fdate(s){ if(!s)return '—'; return new Date(s).toLocaleDateString('pt-BR'); }
function fdatetime(s){ if(!s)return '—'; return new Date(s).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); }
function escHtml(s){ const d=document.createElement('div');d.textContent=s||'';return d.innerHTML; }
function relBar(r){
  const pct=Math.round((r||0)*100);
  const col=pct>=70?'var(--success)':pct>=40?'var(--warn)':'var(--danger)';
  return `<div class="rel-bar"><div class="rel-track"><div class="rel-fill" style="width:${pct}%;background:${col}"></div></div><span style="font-family:var(--mono);font-size:.65rem;color:var(--text-dim)">${pct}%</span></div>`;
}
function impactoBadge(i){ return `<span class="badge b-${i||'medio'}">${(i||'medio').toUpperCase()}</span>`; }
function catPills(cats){
  if(!cats||!cats.length) return '<span style="color:var(--text-dim);font-size:.75rem">—</span>';
  return cats.map(c=>`<span style="background:${c.cor}18;color:${c.cor};border:1px solid ${c.cor}44;font-family:var(--mono);font-size:.62rem;padding:2px 7px;border-radius:3px">${escHtml(c.nome)}</span>`).join(' ');
}
function set$(id,html){ const el=document.getElementById(id);if(el)el.innerHTML=html; }

// ── DASHBOARD ─────────────────────────────────────────────────────────────────
async function renderDashboard(){
  const r=await api('GET','/api/dashboard');
  const s=r.data||{};
  set$('main',`
    <div class="phd"><div><div class="pctx">VISÃO GERAL</div><div class="ptit">Dashboard</div></div>
      ${canEdit()?`<div class="pact">
        <button class="btn bo" onclick="fetchAllSources()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
          Coletar RSS
        </button>
      </div>`:''}
    </div>
    <div class="mgrid">
      <div class="mc"><div class="mlb">Notícias</div><div class="mv sky">${s.total_noticias??0}</div></div>
      <div class="mc"><div class="mlb">Fontes Ativas</div><div class="mv dim">${s.total_fontes??0}</div></div>
      <div class="mc"><div class="mlb">Insights</div><div class="mv warn">${s.total_insights??0}</div></div>
      <div class="mc"><div class="mlb">KPIs</div><div class="mv green">${s.total_kpis??0}</div></div>
      <div class="mc"><div class="mlb">Newsletters Hoje</div><div class="mv sky">${s.newsletters_hoje??0}</div></div>
      <div class="mc"><div class="mlb">Usuários</div><div class="mv dim">${s.total_usuarios??0}</div></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
      <div class="card">
        <div class="chd"><span class="cttl">NOTÍCIAS RECENTES</span></div>
        <div class="cbdy" style="padding:0">
          ${(s.noticias_recentes||[]).length===0?'<div class="empty"><p>Sem notícias</p></div>':''}
          ${(s.noticias_recentes||[]).map(n=>`
            <div style="padding:10px 18px;border-bottom:1px solid var(--border);cursor:pointer" onclick="nav('noticias')">
              <div style="font-size:.85rem;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escHtml(n.titulo)}</div>
              <div style="display:flex;align-items:center;gap:10px;margin-top:4px">
                <span style="font-family:var(--mono);font-size:.62rem;color:var(--text-dim)">${fdatetime(n.coletado_em)}</span>
                ${relBar(n.relevancia)}
              </div>
            </div>`).join('')}
        </div>
      </div>
      <div class="card">
        <div class="chd"><span class="cttl">INSIGHTS RECENTES</span></div>
        <div class="cbdy" style="padding:0">
          ${(s.insights_recentes||[]).length===0?'<div class="empty"><p>Sem insights</p></div>':''}
          ${(s.insights_recentes||[]).map(i=>`
            <div style="padding:10px 18px;border-bottom:1px solid var(--border)">
              <div style="display:flex;align-items:center;gap:8px;justify-content:space-between">
                <span style="font-size:.85rem;font-weight:500;color:var(--text)">${escHtml(i.titulo)}</span>
                ${impactoBadge(i.impacto)}
              </div>
              <div style="font-family:var(--mono);font-size:.62rem;color:var(--text-dim);margin-top:2px">${escHtml(i.departamento_nome||'—')}</div>
            </div>`).join('')}
        </div>
      </div>
    </div>`);
}

async function fetchAllSources(){
  toast('Coletando RSS...','');
  const r=await api('POST','/api/sources/fetch-all');
  if(r.ok) toast(`${r.raw.data?.coletadas??0} notícias coletadas`,'ok');
  else toast(r.error||'Erro na coleta','err');
}

// ── NOTÍCIAS ──────────────────────────────────────────────────────────────────
async function renderNoticias(){
  const r=await api('GET','/api/news?limit=100');
  const news=r.data||[];
  set$('main',`
    <div class="phd">
      <div><div class="pctx">CONTEÚDO</div><div class="ptit">Notícias</div></div>
      ${canEdit()?`<div class="pact">
        <button class="btn bo" onclick="fetchAllSources()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
          Coletar RSS
        </button>
        <button class="btn bp" onclick="openNewsModal()">+ Nova Notícia</button>
      </div>`:''}
    </div>
    <div class="fbar">
      <input class="fsrch" id="ns" placeholder="Buscar..." oninput="filterNews()">
      <select class="fsel" id="ncat" onchange="filterNews()">
        <option value="">Todas as categorias</option>
        ${DATA.categories.map(c=>`<option value="${c.id}">${escHtml(c.nome)}</option>`).join('')}
      </select>
      <select class="fsel" id="nfonte" onchange="filterNews()">
        <option value="">Todas as fontes</option>
        ${DATA.sources.map(s=>`<option value="${s.id}">${escHtml(s.nome)}</option>`).join('')}
      </select>
    </div>
    <div class="card">
      <div class="twrap">
        <table>
          <thead><tr>
            <th>TÍTULO</th><th>CATEGORIAS</th><th>FONTE</th><th>RELEVÂNCIA</th><th>DATA</th>
            ${canEdit()?'<th></th>':''}
          </tr></thead>
          <tbody id="ntbody">
            ${news.length===0?`<tr><td colspan="6" style="text-align:center;color:var(--text-dim);padding:32px">Sem notícias.</td></tr>`:''}
            ${news.map(n=>`
              <tr class="cr" id="nr${n.id}">
                <td><div class="tdt">${escHtml(n.titulo)}</div>${n.url?`<a href="${escHtml(n.url)}" target="_blank" style="font-family:var(--mono);font-size:.62rem;color:var(--accent)">abrir ↗</a>`:''}</td>
                <td>${catPills(n.categorias)}</td>
                <td style="font-family:var(--mono);font-size:.75rem">${escHtml(n.fonte_nome||'Manual')}</td>
                <td>${relBar(n.relevancia)}</td>
                <td style="font-family:var(--mono);font-size:.75rem;white-space:nowrap">${fdate(n.publicado_em||n.coletado_em)}</td>
                ${canEdit()?`<td style="white-space:nowrap">
                  <button class="btn bo" style="padding:4px 8px;font-size:.7rem" onclick="event.stopPropagation();openNewsModal(${JSON.stringify(n).split('"').join('&quot;')})">Editar</button>
                  <button class="btn bd" style="padding:4px 8px;font-size:.7rem" onclick="event.stopPropagation();deleteNews(${n.id})">Excluir</button>
                </td>`:''}
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>`);
  window._allNews=news;
}

function filterNews(){
  const q=(document.getElementById('ns')?.value||'').toLowerCase();
  const cat=document.getElementById('ncat')?.value||'';
  const fonte=document.getElementById('nfonte')?.value||'';
  (window._allNews||[]).forEach(n=>{
    const row=document.getElementById('nr'+n.id);
    if(!row)return;
    const matchQ=!q||n.titulo.toLowerCase().includes(q)||(n.resumo||'').toLowerCase().includes(q);
    const matchCat=!cat||n.categorias.some(c=>String(c.id)===cat);
    const matchF=!fonte||String(n.fonte_id)===fonte;
    row.style.display=(matchQ&&matchCat&&matchF)?'':'none';
  });
}

async function saveSource(id){
  const nome=document.getElementById('sn').value.trim();
  const url=document.getElementById('su').value.trim();
  if(!nome||!url){toast('Nome e URL obrigatórios','err');return;}
  const body={nome,url,tipo:document.getElementById('st').value};
  if(id&&document.getElementById('sativo')) body.ativo=parseInt(document.getElementById('sativo').value);
  const r=id?await api('PUT',`/api/sources/${id}`,body):await api('POST','/api/sources',body);
  if(r.ok){closeM();toast(id?'Fonte atualizada':'Fonte criada','ok');renderFontes();await loadMeta();}

}

async function deleteSource(id){

async function openDeptModal(idOrObj){
  // Aceita tanto um ID numérico (chamado do botão da tabela) quanto um objeto completo
  let d = null;
  if(idOrObj){
    if(typeof idOrObj==='number'){
      d = (window._allDepts||[]).find(x=>x.id===idOrObj) || null;
    } else {
      d = idOrObj;
    }
  }

  // Categorias já associadas ao departamento
  let selCatIds = (d?.categorias||[]).map(c=>c.id);

  const pillsHtml = DATA.categories.map(c=>{
    const isSel = selCatIds.includes(c.id);
    return `<span class="cpill${isSel?' sel':''}" data-id="${c.id}"
      style="background:${isSel?c.cor+'22':'transparent'};color:${c.cor};border-color:${c.cor}"
      onclick="togglePill(this,'${c.cor}')">${escHtml(c.nome)}</span>`;
  }).join('');

  openM(d?'Editar Departamento':'Novo Departamento',`
    <div class="fg"><label class="fl">NOME *</label><input class="finp" id="dn" value="${escHtml(d?.nome||'')}"></div>
    <div class="fg"><label class="fl">DESCRIÇÃO</label><input class="finp" id="dd" value="${escHtml(d?.descricao||'')}"></div>
    <div class="frow">
      <div class="fg"><label class="fl">E-MAIL RESPONSÁVEL</label><input class="finp" id="de" type="email" value="${escHtml(d?.email_responsavel||'')}"></div>
      <div class="fg"><label class="fl">HORÁRIO NEWSLETTER</label><input class="finp" id="dh" type="time" value="${d?.horario_newsletter||'08:00'}"></div>
    </div>
    <div class="fg">
      <label class="fl">CATEGORIAS DE INTERESSE
        <span style="font-weight:400;color:var(--text-dim)"> — notícias dessas categorias vão para este departamento</span>
      </label>
      <div class="cat-pills" id="dcpills">
        ${pillsHtml||'<span style="color:var(--text-dim);font-size:.78rem">Nenhuma categoria cadastrada.</span>'}
      </div>
    </div>`,
    [{label:d?'Salvar':'Criar',cls:'bp',fn:()=>saveDept(d?.id)}]
  );
}

async function saveDept(id){
  const nome=document.getElementById('dn').value.trim();
  if(!nome){toast('Nome obrigatório','err');return;}
  const cats=[...document.querySelectorAll('#dcpills .cpill.sel')].map(el=>parseInt(el.dataset.id));
  const body={
    nome,
    descricao:document.getElementById('dd').value,
    email_responsavel:document.getElementById('de').value,
    horario_newsletter:document.getElementById('dh').value||'08:00',
    categorias:cats,
  };
  const r=id?await api('PUT',`/api/departments/${id}`,body):await api('POST','/api/departments',body);
  if(r.ok){closeM();toast(id?'Departamento atualizado':'Departamento criado','ok');renderDepartamentos();await loadMeta();}
  else toast(r.error||'Erro','err');
}

async function deleteDept(id){
  if(!confirm('Excluir este departamento? Usuários perderão o vínculo.'))return;
  const r=await api('DELETE',`/api/departments/${id}`);
  if(r.ok){toast('Departamento excluído','ok');renderDepartamentos();await loadMeta();}
  else toast(r.error||'Erro','err');
}

async function saveUser(id){
  const nome=document.getElementById('un').value.trim();
  const email=document.getElementById('ue').value.trim();
  if(!nome||!email){toast('Nome e e-mail obrigatórios','err');return;}
  const body={nome,email,role:document.getElementById('ur').value,
    departamento_id:document.getElementById('udept').value||null};
  if(!id) body.senha=document.getElementById('usenha')?.value||'';
  const r=id?await api('PUT',`/api/users/${id}`,body):await api('POST','/api/users',body);
  if(r.ok){closeM();toast(id?'Usuário atualizado':'Usuário criado','ok');renderUsuarios();}
  else toast(r.error||'Erro','err');
}

async function deleteUser(id){
  if(!confirm('Desativar este usuário?'))return;
  const r=await api('DELETE',`/api/users/${id}`);
  if(r.ok){toast('Usuário desativado','ok');renderUsuarios();}
  else toast(r.error||'Erro','err');
}

  set$('main',`
    <div class="phd"><div><div class="pctx">SISTEMA</div><div class="ptit">Configurações</div></div></div>
    <div class="card" style="max-width:580px">
      <div class="chd"><span class="cttl">CONFIGURAÇÃO SMTP</span><span class="chint">Newsletter por e-mail</span></div>
      <div class="cbdy" style="display:flex;flex-direction:column;gap:14px">

        </div>

        </div>
        <div class="fg"><label class="fl">E-MAIL REMETENTE</label><input class="finp" id="sr" value="${escHtml(s.remetente||'')}" placeholder="noreply@empresa.com"></div>
        <div style="display:flex;align-items:center;gap:10px">
          <input type="checkbox" id="stls" ${s.use_tls?'checked':''} style="width:16px;height:16px;cursor:pointer">
          <label for="stls" style="font-size:.82rem;cursor:pointer">Usar TLS (STARTTLS)</label>
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          <input type="checkbox" id="sativo" ${s.ativo?'checked':''} style="width:16px;height:16px;cursor:pointer">
          <label for="sativo" style="font-size:.82rem;cursor:pointer">Ativar envio automático</label>
        </div>

      <div class="cbdy" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:.82rem">
        <div><span style="color:var(--text-dim)">Versão</span><div style="font-family:var(--mono);font-weight:600">1.0.0</div></div>
        <div><span style="color:var(--text-dim)">Porta</span><div style="font-family:var(--mono);font-weight:600">5030</div></div>
        <div><span style="color:var(--text-dim)">Scheduler</span><div id="sched-status" style="font-family:var(--mono);font-weight:600">—</div></div>
        <div><span style="color:var(--text-dim)">FeedParser</span><div id="fp-status" style="font-family:var(--mono);font-weight:600">—</div></div>
      </div>

async function checkStatus(){
  const r=await api('GET','/api/ping');
  if(document.getElementById('sched-status'))
    document.getElementById('sched-status').textContent=r.ok?'Online':'Offline';
  if(document.getElementById('fp-status'))
    document.getElementById('fp-status').textContent=r.ok?'Disponível':'—';
}

async function saveSMTP(){
  const body={
    host:document.getElementById('sh').value.trim(),
    porta:parseInt(document.getElementById('sp').value)||587,
    usuario:document.getElementById('su2').value.trim(),
    remetente:document.getElementById('sr').value.trim(),
    use_tls:document.getElementById('stls').checked?1:0,
    ativo:document.getElementById('sativo').checked?1:0,
  };
  const senha=document.getElementById('ss').value;
  if(senha) body.senha=senha;
  const r=await api('PUT','/api/config/smtp',body);
  if(r.ok) toast('Configurações salvas','ok');
  else toast(r.error||'Erro','err');
}

// ── MODAL ENGINE ──────────────────────────────────────────────────────────────
function openM(title,body,actions=[],size=''){
  document.getElementById('mttl').textContent=title;
  document.getElementById('mbdy').innerHTML=body;
  document.getElementById('mbox').className='mbox'+(size?' '+size:'');
  const ft=document.getElementById('mft');
  ft.innerHTML='<button class="btn bo" onclick="closeM()">Cancelar</button>';
  actions.forEach(a=>{
    const btn=document.createElement('button');
    btn.className=`btn ${a.cls||'bp'}`;
    btn.textContent=a.label;
    btn.onclick=a.fn;
    ft.appendChild(btn);
  });
  document.getElementById('moverlay').classList.add('show');
}

function closeM(){ document.getElementById('moverlay').classList.remove('show'); }
function closeMif(e){ if(e.target===document.getElementById('moverlay')) closeM(); }

// ── INIT ──────────────────────────────────────────────────────────────────────
async function init(){
  const r=await api('GET','/api/auth/me');
  if(r.ok){
    setUser(r.data);
    document.getElementById('ls').classList.add('hidden');
    document.getElementById('app').style.display='flex';
    await loadMeta();
    nav('dashboard');
  }
}
init();

// Dark mode
function toggleDark(){
  document.body.classList.toggle('dark-mode');
  try{localStorage.setItem('theme', document.body.classList.contains('dark-mode')?'dark':'light');}catch(e){}
}
(function(){
  try{if(localStorage.getItem('theme')==='dark')document.body.classList.add('dark-mode');}catch(e){}
})();
</script>
